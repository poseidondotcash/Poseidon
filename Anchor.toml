[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
privacy_wallet = "YOUR_PROGRAM_ID_HERE"

[programs.devnet]
privacy_wallet = "YOUR_PROGRAM_ID_HERE"

[programs.mainnet]
privacy_wallet = "YOUR_PROGRAM_ID_HERE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
