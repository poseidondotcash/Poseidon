# programs/privacy_wallet/Cargo.toml  (the PROGRAM crate)
[package]
name = "privacy_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
groth16-solana = "0.0.3"
light-hasher = "2.0.0"
bytemuck = { version = "1.14", features = ["derive"] }
hex = "0.4"
solana-program = "2.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
sha3 = "0.10"
hex = "0.4"


[features]
default = []
verify = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
no-log-ix-name = []
cpi = []
